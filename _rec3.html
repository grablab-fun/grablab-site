<!doctype html><html><body style="margin:0;background:#000;overflow:hidden"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
import { createSim3D, CAP_R, CHUTE, TRAVEL } from "./sim3d.js?v=rec10";
const q = new URLSearchParams(location.search), seed0 = +(q.get("seed") || 1), camI = +(q.get("cam") || 0), T = +(q.get("T") || 10), KEEP = +(q.get("keep") || 1), DX = q.has("dx") ? +q.get("dx") : .099, DZ = q.has("dz") ? +q.get("dz") : -.048;
const S = createSim3D(document.getElementById("c"), null, { layer2:q.has("l2") }); S.setMain(camI);
let seed = seed0*7919; const rnd = () => (seed = (seed*16807) % 2147483647)/2147483647;
const caps = S.spots().map(([x, z]) => ({ x, z, y:CAP_R, state:"pile" })).filter(() => rnd() < KEEP).concat((S.spots.top || []).map(([x, z]) => ({ x, z, y:CAP_R*2.72, state:"pile" })));
/* the claw hangs 44 mm left and 43 mm in front of the carriage reference the game steers: aim the carriage past each spot by that much, inside the gantry's real reach */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), reachX = x => clamp(x + DX, TRAVEL.x0, TRAVEL.x1), reachZ = z => clamp(z + DZ, TRAVEL.z0, TRAVEL.z1);
const canReach = c => Math.abs(reachX(c.x) - c.x - DX) < .001 && Math.abs(reachZ(c.z) - c.z - DZ) < .001;
const CX = reachX(CHUTE.cx), CZ = reachZ(CHUTE.cz);
const pickable = (S.spots.top && S.spots.top.length ? caps.filter(c => c.y > CAP_R*2) : caps).filter(canReach);
const tgt = pickable[Math.floor(rnd()*pickable.length)], home = { x:.25 + rnd()*.29, z:.3 + rnd()*.2 };
const TX = reachX(tgt.x), TZ = reachZ(tgt.z), TX0 = tgt.x, TZ0 = tgt.z, Y0 = tgt.y;
const st = { x:home.x, z:home.z, y:.98, open:0, sw:0, held:null };
const e = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2, seg = (t, a, b) => t <= a ? 0 : t >= b ? 1 : e((t - a)/(b - a));
const lerp = (a, b, k) => a + (b - a)*k;
let prevX = st.x;
window.frameAt = t => {
  const k = t/T*10, low = Y0 + CAP_R*.25;
  const go1 = seg(k, 0, 2.4), down = seg(k, 2.6, 3.6) - seg(k, 4.1, 5.1), go2 = seg(k, 5.2, 7.4), back = seg(k, 8.8, 10);
  st.x = lerp(lerp(lerp(home.x, TX, go1), CX, go2), home.x, back); st.z = lerp(lerp(lerp(home.z, TZ, go1), CZ, go2), home.z, back);
  st.y = lerp(.98, low + .1, down);
  st.open = k < 2.6 ? 0 : k < 3.7 ? seg(k, 2.6, 3.3) : k < 4.1 ? 1 - seg(k, 3.7, 4.05)*.42 : k < 7.6 ? .58 : k < 8.8 ? 1 : 1 - seg(k, 8.8, 9.6);
  const v = (st.x - prevX)*60; prevX = st.x; st.sw += (-v*.22 - st.sw)*.25;
  if (k >= 4.05 && k < 7.6){ st.held = tgt; tgt.state = "held"; }
  else if (k >= 7.6){ st.held = null; tgt.state = "chute"; tgt.x = CX - DX; tgt.z = CZ - DZ; tgt.y = lerp(.83, -.5, Math.min(1, Math.pow((k - 7.6)/.9, 2))); }
  else { st.held = null; tgt.state = "pile"; tgt.x = TX0; tgt.z = TZ0; tgt.y = Y0; }
  S.draw(st, caps); return document.getElementById("c").toDataURL("image/jpeg", .95);
};
window.ready = true;
</script></body></html>
